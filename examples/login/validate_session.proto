// examples/login/validate_session.proto: Session-validation service used by the gRPC example.
// Ash Vardanian, March 21, 2023.

syntax = "proto3";

package login;

service LoginService {
  rpc Validate (ValidateRequest) returns (ValidateResponse) {}
}

message ValidateRequest {
  int64 user_id = 1;
  int64 session_id = 2;
}

message ValidateResponse {
  bool result = 1;
}


