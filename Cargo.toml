[package]
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "HTTP and Noise clients and servers with capability-specialized I/O backends"
keywords = ["http", "rpc", "server", "io-uring", "noise"]
edition = "2021"
include = [
  "/rust/**",
  "/include/**",
  "/src/**",
  "/c/**",
  "/CMakeLists.txt",
  "/cmake/ucall_*.cmake",
  "/VERSION",
  "/build.rs",
]
license = "Apache-2.0"
links = "ucall"
name = "ucall"
publish = true
repository = "https://github.com/unum-cloud/UCall"
documentation = "https://docs.rs/ucall"
version = "1.0.0-rc.1"

[lib]
name = "ucall"
path = "rust/lib.rs"

[build-dependencies]
# The library is CMake's to build, so `build.rs` drives it rather than restating its per-class flags.
cmake = "0.1"

[dev-dependencies]
# The file-part tests open descriptors with `O_DIRECT`, whose value differs between architectures.
libc = "0.2"
