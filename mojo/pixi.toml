# The Mojo binding, which `dlopen`s the engine rather than linking it, so `ucall` is a run dependency and a
# consumer naming this package by `git` or `path` needs no linker flags of its own.

[package]
authors = ["Ash Vardanian <info@unum.cloud>"]
description = "Native HTTP and Noise networking with caller-owned polling and request batching"
license = "Apache-2.0"
name = "ucall_mojo"
version = "1.0.0-rc.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

# The backend only auto-discovers a package under `<name>/` or `src/`, and this one lives under
# `ucall/`, so it is named here.
[package.build.config]
pkg = { name = "ucall", path = "ucall" }

[package.run-dependencies]
ucall = { path = ".." }
