name: Pre-Release

on:
  push:
    branches: [main, main-dev]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

jobs:
  lint:
    name: Check source conventions
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install formatters
        run: python -m pip install --group lint
      - name: Check Markdown formatting
        uses: dprint/check@v2
        with:
          dprint-version: "0.59.0"
      - name: Check the changed source
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$CHANGE_BASE"
          if ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            base=$(git rev-parse HEAD^)
          fi
          UCALL_LINT_BASE="$base" .githooks/pre-commit
      - name: Compile Python sources
        run: python -m compileall -q python test bench examples

  native:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-26.04
            preset: debug
            compilers: -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
            config: Debug
          - name: Linux Clang
            os: ubuntu-26.04
            preset: relwithdebinfo
            compilers: -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
            config: RelWithDebInfo
          - name: macOS
            os: macos-15
            preset: relwithdebinfo
            compilers: ""
            config: RelWithDebInfo
          - name: Windows
            os: windows-2025
            preset: relwithdebinfo
            compilers: ""
            config: RelWithDebInfo
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout with sibling libraries
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 clang-22
      - name: Configure C and C++
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.compilers }} -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} --parallel 4
      - name: Test C and C++
        run: ctest --preset ${{ matrix.preset }} --build-config ${{ matrix.config }}
