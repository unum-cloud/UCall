name: Pre-Release

on:
  pull_request:
    branches: ["main", "main-dev"]

env:
  BUILD_TYPE: Release
  PYTHONUTF8: 1

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:

  versioning:
    name: Update Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v2.0.7
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+)
          update-major-version-in: |
            include/ucall/ucall.h:^#define UCALL_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/ucall/ucall.h:^#define UCALL_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/ucall/ucall.h:^#define UCALL_VERSION_PATCH (\d+)
          dry-run: "true"

  test_python:
    name: Test Python
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init --recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy
      - name: Build locally
        run: python -m pip install .
