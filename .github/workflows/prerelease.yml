name: Pre-Release

on:
  pull_request:
    branches: ["main", "main-dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    name: Check Commits
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Every Commit
        run: .github/scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}"

  test_c:
    name: Test C
    needs: hooks
    uses: ./.github/workflows/test-c.yml

  test_python:
    name: Test Python
    needs: hooks
    uses: ./.github/workflows/test-python.yml

  test_docs:
    name: Test Docs
    needs: hooks
    uses: ./.github/workflows/test-docs.yml
