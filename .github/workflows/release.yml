name: Release

on:
  push:
    branches: ["main"]

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate the release
    uses: ./.github/workflows/prerelease.yml

  versioning:
    name: Update Version
    needs: validate
    if: github.repository == 'unum-cloud/UCall'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Update version and create the release
        uses: ashvardanian/tinysemver@v3
        with:
          version-file: VERSION
          update-version-in: |
            CITATION.cff:^version: (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
          update-major-version-in: |
            c/ucall/types.h:^#define UCALL_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            c/ucall/types.h:^#define UCALL_VERSION_MINOR (\d+)
          update-patch-version-in: |
            c/ucall/types.h:^#define UCALL_VERSION_PATCH (\d+)
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  build_wheels:
    name: Build Python ${{ matrix.python-version }} for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: versioning
    strategy:
      matrix:
        os: [macos-15, windows-2025]
        python-version: ["312", "313", "314"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          overwrite: true

  build_linux_wheels:
    name: Build Python ${{ matrix.python-version }} for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: versioning
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout with sibling libraries
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel tools
        run: python -m pip install build auditwheel "cmake>=3.28"
      - name: Install wheel repair tools
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Build the wheel on Ubuntu
        run: python -m build --wheel
      - name: Repair the Linux wheel
        run: auditwheel repair --lib-sdir . --wheel-dir wheelhouse dist/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

  publish_python:
    name: Publish Python
    needs: [build_wheels, build_linux_wheels]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/ucall
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    needs: publish_python
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install the Released UCall
        run: pip install "ucall==$(cat VERSION)"
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W
      - name: Compress Docs
        run: tar -czvf docs.tar.gz build/docs/html/
      - name: Upload Docs to Release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: docs.tar.gz
          update_latest_release: true

  deploy_docs_pages:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build_docs
    steps:
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: docs.tar.gz
      - name: Unpack Docs
        run: tar -xf ./docs.tar.gz
      - name: Set Up GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/docs/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
