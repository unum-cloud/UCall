name: Test Rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test_rust:
    name: Test Rust on Ubuntu
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-22
      - name: Test Rust
        run: cargo test
        env:
          CC: clang-22
          CXX: clang++-22
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
        env:
          CC: clang-22
          CXX: clang++-22
      - name: List Packaged Files
        run: cargo package --list
