name: Test Rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test_rust_ubuntu_clang:
    name: Test Rust on Ubuntu
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23
      - name: Install Rust
        # rustup reads the channel and components from rust-toolchain.toml.
        run: rustup toolchain install
      - name: Test Rust
        run: cargo test
        env:
          CC: clang-23
          CXX: clang++-23
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
        env:
          CC: clang-23
          CXX: clang++-23
      - name: List Packaged Files
        run: cargo package --list
