name: Test C

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test_c_ubuntu_gcc:
    name: Test Debug Build on Ubuntu with GCC 16
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 clang-23
      - name: Configure C and C++
        run: cmake --preset debug -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16 -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset debug --config Debug --parallel 4
      - name: Test C and C++
        run: ctest --preset debug --build-config Debug --no-tests=error --verbose | tee ctest.log
      - name: Require Every Linux Backend
        run: |
          if grep -E '^[0-9]+: skipped +(io|network) (linux-epollaio|linux-uring612|linux-uring618)' ctest.log; then
            echo "A Linux backend suite skipped, so its queue went untested"
            exit 1
          fi

  test_c_ubuntu_clang:
    name: Test on Ubuntu with Clang 23
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 clang-23
      - name: Configure C and C++
        run: cmake --preset relwithdebinfo -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset relwithdebinfo --config RelWithDebInfo --parallel 4
      - name: Test C and C++
        run: ctest --preset relwithdebinfo --build-config RelWithDebInfo --no-tests=error --verbose | tee ctest.log
      - name: Require Every Linux Backend
        run: |
          if grep -E '^[0-9]+: skipped +(io|network) (linux-epollaio|linux-uring612|linux-uring618)' ctest.log; then
            echo "A Linux backend suite skipped, so its queue went untested"
            exit 1
          fi

  test_c_ubuntu_clang_sanitizers:
    name: Test ${{ matrix.preset }} Preset on Ubuntu with Clang 23
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-23
      # ThreadSanitizer's fixed shadow ranges collide with the runner kernel's wider mmap randomization.
      - name: Narrow Address Randomization
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure C and C++
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
      - name: Build C and C++
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test C and C++
        run: ctest --preset ${{ matrix.preset }} --no-tests=error --verbose | tee ctest.log
      - name: Require Every Linux Backend
        run: |
          if grep -E '^[0-9]+: skipped +(io|network) (linux-epollaio|linux-uring612|linux-uring618)' ctest.log; then
            echo "A Linux backend suite skipped, so its queue went untested"
            exit 1
          fi

  test_c_macos_appleclang:
    name: Test on macOS
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Configure C and C++
        run: cmake --preset relwithdebinfo -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset relwithdebinfo --config RelWithDebInfo --parallel 4
      - name: Test C and C++
        run: ctest --preset relwithdebinfo --build-config RelWithDebInfo --no-tests=error --verbose | tee ctest.log
      - name: Require the Kqueue Backend
        run: |
          if grep -E '^[0-9]+: skipped +(io|network) bsd-kqueue' ctest.log; then
            echo "The kqueue suite skipped, so its queue went untested"
            exit 1
          fi

  test_c_windows_msvc:
    name: Test on Windows with Visual Studio 2026
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Configure C and C++
        run: cmake --preset msvc2026_x64 -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset msvc2026_x64 --config Release --parallel 4
      - name: Test C and C++
        run: ctest --preset msvc2026_x64 --build-config Release --no-tests=error --verbose | tee ctest.log
      - name: Require the IOCP Backend
        run: |
          if grep -E '^[0-9]+: skipped +network windows-iocp' ctest.log; then
            echo "The IOCP suite skipped, so its queue went untested"
            exit 1
          fi

  # The toolchain file runs each suite on an emulated RVA23 core with Zacas, which admits the `alibaba_c930` class.
  test_c_qemu_riscv64_gcc:
    name: Test RISC-V under QEMU
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install GCC 16 for RISC-V and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16-riscv64-linux-gnu g++-16-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
      - name: Configure C and C++
        run: cmake --preset linux_riscv64
      - name: Build C and C++
        run: cmake --build --preset linux_riscv64 --parallel 4
      - name: Test C and C++
        run: ctest --preset linux_riscv64 --no-tests=error --verbose | tee ctest.log
      - name: Require the RISC-V Class
        run: |
          if ! grep -qE '^[0-9]+: passed +(io|network) posix alibaba-c930' ctest.log; then
            echo "No suite ran the alibaba_c930 class, so its kits and atomics went untested"
            exit 1
          fi

  # The toolchain file runs each suite on an emulated POWER10, which admits the `ibm_power10` class.
  test_c_qemu_ppc64le_gcc:
    name: Test POWER10 under QEMU
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install GCC 15 for POWER and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu libc6-dev-ppc64el-cross qemu-user
      - name: Configure C and C++
        run: cmake --preset linux_ppc64le
      - name: Build C and C++
        run: cmake --build --preset linux_ppc64le --parallel 4
      - name: Test C and C++
        run: ctest --preset linux_ppc64le --no-tests=error --verbose | tee ctest.log
      - name: Require the POWER10 Class
        run: |
          if ! grep -qE '^[0-9]+: passed +(io|network) posix ibm-power10' ctest.log; then
            echo "No suite ran the ibm_power10 class, so its kits and atomics went untested"
            exit 1
          fi

  # Every target at -O0 with warnings as errors, so a warning any example or benchmark raises fails here.
  check_c_ubuntu_clang:
    name: Check Every Target on Ubuntu with Clang 23
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Clang 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y clang-23
      - name: Build Every Target
        run: |
          cmake --preset check -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset check --parallel 4

  # Each parser's libFuzzer harness runs five minutes, seeded by the run number, and a failure keeps what it found.
  fuzz_c_ubuntu_clang:
    name: Fuzz ${{ matrix.target }} Parser on Ubuntu with Clang 23
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [dns, http, multipart, routes, tunnel, url]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Clang 23 and libFuzzer
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y clang-23 libclang-rt-23-dev
      - name: Build the ${{ matrix.target }} Harness
        run: |
          cmake --preset fuzz -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build --preset fuzz --target ucall_fuzz_${{ matrix.target }} --parallel 4
      - name: Fuzz the ${{ matrix.target }} Parser
        working-directory: build_fuzz
        env:
          UBSAN_OPTIONS: halt_on_error=1 print_stacktrace=1
        run: |
          mkdir -p corpus findings
          ./ucall_fuzz_${{ matrix.target }} -max_total_time=300 -seed=${{ github.run_number }} -artifact_prefix=findings/ corpus
      - name: Upload ${{ matrix.target }} Findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-findings
          path: build_fuzz/findings/

  # The archive and the shared library as a C program sees them once installed: through CMake's package and through
  # pkg-config. The installed archive brings the liburing it was built with as `ucall::uring`, so the runner has none.
  test_c_ubuntu_clang_install:
    name: Install And Consume On Ubuntu
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CC: clang-23
      CXX: clang++-23
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Clang 23 and pkg-config
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y clang-23 pkg-config
      - name: Build and Install
        run: |
          cmake -B build_install -D CMAKE_BUILD_TYPE=Release -D UCALL_BUILD_SHARED=ON
          cmake --build build_install --parallel 4
          cmake --install build_install --prefix "$RUNNER_TEMP/ucall"
      - name: Consume Through find_package
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.28)
          project(consumer LANGUAGES C)
          find_package(ucall 1 REQUIRED)
          add_executable(hello_static "$GITHUB_WORKSPACE/examples/hello.c")
          target_link_libraries(hello_static PRIVATE ucall::static)
          add_executable(hello_shared "$GITHUB_WORKSPACE/examples/hello.c")
          target_link_libraries(hello_shared PRIVATE ucall::shared)
          EOF
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" -D CMAKE_PREFIX_PATH="$RUNNER_TEMP/ucall"
          cmake --build "$RUNNER_TEMP/consumer/build"
      - name: Consume Through pkg-config
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/ucall/lib/pkgconfig"
          "$CC" examples/hello.c $(pkg-config --cflags --libs ucall) -o "$RUNNER_TEMP/hello_pkg_config"
          LD_LIBRARY_PATH="$RUNNER_TEMP/ucall/lib" ldd "$RUNNER_TEMP/hello_pkg_config" | grep -q libucall_shared
      # The Quickstart greets itself through a client bound to its own server, and exits nonzero on a wrong answer.
      - name: Run the Quickstart
        run: |
          "$RUNNER_TEMP/consumer/build/hello_static"
          LD_LIBRARY_PATH="$RUNNER_TEMP/ucall/lib" "$RUNNER_TEMP/consumer/build/hello_shared"
          LD_LIBRARY_PATH="$RUNNER_TEMP/ucall/lib" "$RUNNER_TEMP/hello_pkg_config"

  # The C suite against the stand-in in `src_stub/`, which validates every call as the headers document and serves no
  # network, so the same `c/test.c` holds both libraries to one list of refusals.
  test_c_ubuntu_clang_stub:
    name: Test the C Stub on Ubuntu with Clang 23
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Clang 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y clang-23
      - name: Build the Engine and the Stub
        run: |
          cmake --preset debug -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23 -DUCALL_BUILD_STUB=ON
          cmake --build --preset debug --target ucall_test_c ucall_test_c_stub --parallel 4
      - name: Test the C Interface on Both
        run: ctest --preset debug -R '^ucall_test_c' --no-tests=error --verbose

  # AlmaLinux 8 ships Linux 4.18 headers, so the build proves the kernel mirrors suffice and the test checks them.
  test_c_manylinux_gcc:
    name: Build C Library on Old Kernel Headers
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build C Library
        run: |
          cmake -B build_old_headers -D UCALL_BUILD_SHARED=ON -D UCALL_BUILD_TEST=ON -D CMAKE_BUILD_TYPE=Release
          cmake --build build_old_headers --parallel 4 --target ucall_shared ucall_test_c
      - name: Test C Library
        run: build_old_headers/ucall_test_c

  # Each machine profile builds the library for one CPU; the Arm ones build natively on Arm runners. Clang 23 compiles
  # it, as older compilers predate Olympus.
  build_c_ubuntu_clang_profiles:
    name: Build Machine Profile ${{ matrix.preset }}
    runs-on: ${{ contains(fromJSON('["grace", "vera"]'), matrix.preset) && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [xeon4, xeon6, venice, grace, vera]
    env:
      CC: clang-23
      CXX: clang++-23
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Clang 23
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update && sudo apt-get install -y clang-23
      - name: Build Library
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX"
          cmake --build --preset ${{ matrix.preset }} --parallel 4

  # The NDK's own toolchain builds the library over the `linux-epollaio` backend; nothing runs it.
  build_c_android_ndk:
    name: Build for Android ARM64
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build Library
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          cmake --preset android_arm64
          cmake --build --preset android_arm64 --parallel 4

  verify_models:
    name: Check Promela Models and GenMC Clients
    runs-on: ubuntu-26.04
    container: ghcr.io/ashvardanian/fatwheels:verify@sha256:c29899edae67fe85f0fa80ec3dfaa577a24e297cd4796c0fcdddda60a9010415
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull the ForkUnion Submodule
        run: git submodule update --init forkunion
      - name: Check Models and Clients
        run: verification/check.sh

