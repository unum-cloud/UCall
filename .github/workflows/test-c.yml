name: Test C

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test_ubuntu_debug:
    name: Test Debug Build on Ubuntu with GCC 15
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 clang-22
      - name: Configure C and C++
        run: cmake --preset debug -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset debug --config Debug --parallel 4
      - name: Test C and C++
        run: ctest --preset debug --build-config Debug --no-tests=error | tee ctest.log
      - name: Require Every Linux Backend
        run: |
          if grep -E '^[[:space:]]+[0-9]+ - (epollaio|uring612|uring618) \(Skipped\)' ctest.log; then
            echo "A Linux backend suite skipped, so its engine went untested"
            exit 1
          fi

  test_ubuntu_clang:
    name: Test on Ubuntu with Clang 22
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 clang-22
      - name: Configure C and C++
        run: cmake --preset relwithdebinfo -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset relwithdebinfo --config RelWithDebInfo --parallel 4
      - name: Test C and C++
        run: ctest --preset relwithdebinfo --build-config RelWithDebInfo --no-tests=error | tee ctest.log
      - name: Require Every Linux Backend
        run: |
          if grep -E '^[[:space:]]+[0-9]+ - (epollaio|uring612|uring618) \(Skipped\)' ctest.log; then
            echo "A Linux backend suite skipped, so its engine went untested"
            exit 1
          fi

  test_ubuntu_sanitizers:
    name: Test ${{ matrix.preset }} Preset on Ubuntu with Clang 22
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Linux Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-22
      # ThreadSanitizer's fixed shadow ranges collide with the runner kernel's wider mmap randomization.
      - name: Narrow Address Randomization
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure C and C++
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
      - name: Build C and C++
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test C and C++
        run: ctest --preset ${{ matrix.preset }} --no-tests=error | tee ctest.log
      - name: Require Every Linux Backend
        run: |
          if grep -E '^[[:space:]]+[0-9]+ - (epollaio|uring612|uring618) \(Skipped\)' ctest.log; then
            echo "A Linux backend suite skipped, so its engine went untested"
            exit 1
          fi

  test_macos:
    name: Test on macOS
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Configure C and C++
        run: cmake --preset relwithdebinfo -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset relwithdebinfo --config RelWithDebInfo --parallel 4
      - name: Test C and C++
        run: ctest --preset relwithdebinfo --build-config RelWithDebInfo --no-tests=error | tee ctest.log
      - name: Require the Kqueue Backend
        run: |
          if grep -E '^[[:space:]]+[0-9]+ - kqueue \(Skipped\)' ctest.log; then
            echo "The kqueue suite skipped, so its engine went untested"
            exit 1
          fi

  test_windows:
    name: Test on Windows with Visual Studio 2026
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Configure C and C++
        run: cmake --preset msvc2026_x64 -DUCALL_BUILD_EXAMPLES=ON -DUCALL_BUILD_BENCH=ON
      - name: Build C and C++
        run: cmake --build --preset msvc2026_x64 --config Release --parallel 4
      - name: Test C and C++
        run: ctest --preset msvc2026_x64 --build-config Release --no-tests=error | tee ctest.log
      - name: Require the IOCP Backend
        run: |
          if grep -E '^[[:space:]]+[0-9]+ - iocp \(Skipped\)' ctest.log; then
            echo "The IOCP suite skipped, so its engine went untested"
            exit 1
          fi

  # Every target at -O0 with warnings as errors, so a warning any example or benchmark raises fails here.
  check_ubuntu:
    name: Check Every Target on Ubuntu with Clang 22
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Clang 22
        run: sudo apt-get update && sudo apt-get install -y clang-22
      - name: Build Every Target
        run: |
          cmake --preset check -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
          cmake --build --preset check --parallel 4

  # Each parser's libFuzzer harness runs five minutes, seeded by the run number, and a failure keeps what it found.
  fuzz_ubuntu:
    name: Fuzz ${{ matrix.target }} Parser on Ubuntu with Clang 22
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [dns, http, multipart, routes, tunnel, url]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Clang 22 and libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang-22 libclang-rt-22-dev
      - name: Build the ${{ matrix.target }} Harness
        run: |
          cmake --preset fuzz -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
          cmake --build --preset fuzz --target ucall_fuzz_${{ matrix.target }} --parallel 4
      - name: Fuzz the ${{ matrix.target }} Parser
        working-directory: build_fuzz
        env:
          UBSAN_OPTIONS: halt_on_error=1 print_stacktrace=1
        run: |
          mkdir -p corpus findings
          ./ucall_fuzz_${{ matrix.target }} -max_total_time=300 -seed=${{ github.run_number }} -artifact_prefix=findings/ corpus
      - name: Upload ${{ matrix.target }} Findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}-findings
          path: build_fuzz/findings/

  # The archive and the shared library as a C program sees them once installed: through CMake's package and through
  # pkg-config. The installed archive brings the liburing it was built with as `ucall::uring`, so the runner has none.
  install_ubuntu:
    name: Install And Consume On Ubuntu
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15t"
      - name: Install CMake
        run: python -m pip install "cmake>=3.28"
      - name: Install Clang 22 and pkg-config
        run: sudo apt-get update && sudo apt-get install -y clang-22 pkg-config
      - name: Build and Install
        run: |
          cmake -B build_install -D CMAKE_BUILD_TYPE=Release -D UCALL_BUILD_SHARED=ON
          cmake --build build_install --parallel 4
          cmake --install build_install --prefix "$RUNNER_TEMP/ucall"
      - name: Consume Through find_package
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/CMakeLists.txt" <<EOF
          cmake_minimum_required(VERSION 3.28)
          project(consumer LANGUAGES C)
          find_package(ucall 1 REQUIRED)
          add_executable(hello_static "$GITHUB_WORKSPACE/examples/hello.c")
          target_link_libraries(hello_static PRIVATE ucall::static)
          add_executable(hello_shared "$GITHUB_WORKSPACE/examples/hello.c")
          target_link_libraries(hello_shared PRIVATE ucall::shared)
          EOF
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" -D CMAKE_PREFIX_PATH="$RUNNER_TEMP/ucall"
          cmake --build "$RUNNER_TEMP/consumer/build"
      - name: Consume Through pkg-config
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/ucall/lib/pkgconfig"
          "$CC" examples/hello.c $(pkg-config --cflags --libs ucall) -o "$RUNNER_TEMP/hello_pkg_config"
          LD_LIBRARY_PATH="$RUNNER_TEMP/ucall/lib" ldd "$RUNNER_TEMP/hello_pkg_config" | grep -q libucall_shared

  # AlmaLinux 8 carries Linux 4.18 headers, so the build proves the kernel mirrors suffice and the test checks them.
  test_old_kernel_headers:
    name: Build C Library on Old Kernel Headers
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build C Library
        run: |
          cmake -B build_old_headers -D UCALL_BUILD_SHARED=ON -D UCALL_BUILD_TEST=ON -D CMAKE_BUILD_TYPE=Release
          cmake --build build_old_headers --parallel 4 --target ucall_shared ucall_test_c
      - name: Test C Library
        run: build_old_headers/ucall_test_c

  # Each machine profile builds the library for one CPU; the Arm ones build natively on Arm runners. Clang 22 compiles
  # it, as older compilers predate Olympus.
  build_machine_profile:
    name: Build Machine Profile ${{ matrix.preset }}
    runs-on: ${{ contains(fromJSON('["grace_hopper", "vera_rubin"]'), matrix.preset) && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [xeon4_hopper, xeon6_blackwell, venice_mi450, grace_hopper, vera_rubin]
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Clang 22
        run: sudo apt-get update && sudo apt-get install -y clang-22
      - name: Build Library
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX"
          cmake --build --preset ${{ matrix.preset }} --parallel 4

  # The NDK's own toolchain builds the library over the epoll backend; nothing runs it.
  build_android:
    name: Build for Android ARM64
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build Library
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          cmake --preset android_arm64
          cmake --build --preset android_arm64 --parallel 4

  verify_models:
    name: Check Promela Models and GenMC Clients
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Pull ForkUnion Submodule
        run: git submodule update --init forkunion
      - name: Install Spin, Clang and GenMC Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y spin cmake clang-20 llvm-20-dev libffi-dev zlib1g-dev libedit-dev
      - name: Checkout GenMC
        uses: actions/checkout@v7
        with:
          repository: MPI-SWS/genmc
          ref: 9f6c4c0772d0c42b325681581acc6a0f3eb9b5f7
          path: genmc
      - name: Restore GenMC Build
        id: genmc
        uses: actions/cache@v6
        with:
          path: genmc/build
          key: genmc-9f6c4c0-clang-20
      - name: Build GenMC
        if: steps.genmc.outputs.cache-hit != 'true'
        run: |
          cmake -S genmc -B genmc/build -D CMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build genmc/build --parallel
      - name: Check Models and Clients
        run: verification/check.sh
        env:
          GENMC: ${{ github.workspace }}/genmc/build/bin/genmc
          GENMC_CLANG: clang++-20
