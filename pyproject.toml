# Wheels for CPython 3.12 to 3.14 from the project's CMake tree.
[build-system]
requires = ["setuptools>=77", "wheel", "cmake>=3.28"]
build-backend = "setuptools.build_meta"

# Groups rather than extras, so none of this reaches the published wheel's metadata.
[dependency-groups]
lint = ["ruff>=0.15.8", "clang-format==22.*", "cmakelang>=0.6"]
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["stringzilla"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "YTT", "B", "SIM", "TID", "D200", "D201", "D202", "D205", "D209", "D210", "D212", "D300", "D415"]
ignore = ["E501", "E741"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"python/ucall/__init__.py" = ["F401", "E402"]
".cmake-format.py" = ["F821"]
"cmake-format.py" = ["F821"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["ucall"]
combine-as-imports = true

# Integration suites require a running example server.
[tool.cibuildwheel]
test-requires = []
test-command = ""
build-verbosity = 0
skip = []

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]
before-build = [
    "rm -rf {project}/CMakeCache.txt {project}/build {project}/build_debug {project}/CMakeFiles.txt {project}/_deps {project}/.pytest_cache",
    "git submodule update --init --recursive",
]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"


[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]
before-build = [
    "rd /s /q {project}\\CMakeCache.txt {project}\\build {project}\\build_debug {project}\\CMakeFiles.txt {project}\\_deps {project}\\.pytest_cache || echo Done",
    "git submodule update --init --recursive",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "Body"]
